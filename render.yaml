services:
  - type: web
    name: customer-case-intelligence
    runtime: docker
    plan: free
    region: virginia
    numInstances: 1
    autoDeployTrigger: checksPass
    renderSubdomainPolicy: enabled
    healthCheckPath: /health
    envVars:
      - key: COOKIE_SECURE
        value: "true"
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: CCI_RUNTIME_DIR
        value: /app/work/state
      - key: CCI_INDEX_DIR
        value: /app/work/index
      - key: EMBEDDING_CACHE
        value: /app/work/models
      - key: VECTOR_BACKEND
        value: pinecone
      - key: PINECONE_INDEX_NAME
        value: customer-case-intelligence
      - key: PINECONE_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: CCI_BOOTSTRAP_USERNAME
        value: owner
      - key: CCI_BOOTSTRAP_PASSWORD
        sync: false
      - key: REQUIRE_DURABLE_STORAGE
        value: "true"
      - key: CCI_LOW_MEMORY
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: cci-private-documents
